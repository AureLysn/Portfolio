<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="AureLysnOS Prague Fibonacci Astronomical Clockwork">
  <defs>
    <!-- Rich Horological Brass/Gold Gradient -->
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="35%" stop-color="#E5BF70"/>
      <stop offset="70%" stop-color="#BA903B"/>
      <stop offset="100%" stop-color="#7A5617"/>
    </linearGradient>

    <!-- Warm Amber Glow for Hand and Escapement -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9A5C"/>
      <stop offset="100%" stop-color="#FFC085"/>
    </linearGradient>

    <!-- Steel / Dark Slate Gear Tone -->
    <linearGradient id="gearSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243256"/>
      <stop offset="100%" stop-color="#121A33"/>
    </linearGradient>

    <radialGradient id="clockAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5BF70" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#0C1224" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0C1224" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#clockAura)" stroke="none"/>

  <!-- ================= 1. PRAGUE OUTER ASTRONOMICAL DIALS ================= -->
  <g id="outer-dials" stroke="url(#brassGold)">
    <!-- Outermost Bezel -->
    <circle cx="250" cy="250" r="232" fill="none" stroke-width="1.2" stroke-opacity="0.4"/>
    <circle cx="250" cy="250" r="224" fill="none" stroke-width="2.2" stroke-opacity="0.95"/>
    <circle cx="250" cy="250" r="212" fill="none" stroke-width="0.8" stroke-dasharray="2 3" stroke-opacity="0.6"/>
    <circle cx="250" cy="250" r="188" fill="none" stroke-width="1.8" stroke-opacity="0.85"/>

    <!-- 24-Hour Bohemian Ticks -->
    <g stroke-width="1" stroke-opacity="0.6">
      <line x1="250" y1="212" x2="250" y2="224"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(15, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(30, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(45, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(60, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(75, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(90, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(105, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(120, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(135, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(150, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(165, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(180, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(195, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(210, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(225, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(240, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(255, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(270, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(285, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(300, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(315, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(330, 250, 250)"/>
      <line x1="250" y1="212" x2="250" y2="224" transform="rotate(345, 250, 250)"/>
    </g>

    <!-- 12 Roman Numerals on Inner Track -->
    <g font-family="Georgia, serif" font-size="11" font-weight="bold" fill="url(#brassGold)" stroke="none" text-anchor="middle" dominant-baseline="central">
      <text x="250" y="200">XII</text>
      <text x="300" y="213">I</text>
      <text x="337" y="250">II</text>
      <text x="350" y="300">III</text>
      <text x="337" y="350">IV</text>
      <text x="300" y="387">V</text>
      <text x="250" y="400">VI</text>
      <text x="200" y="387">VII</text>
      <text x="163" y="350">VIII</text>
      <text x="150" y="300">IX</text>
      <text x="163" y="250">X</text>
      <text x="200" y="213">XI</text>
    </g>
  </g>

  <!-- ================= 2. ECCENTRIC PRAGUE ECLIPTIC RING ================= -->
  <!-- The Prague clock features an eccentric off-center golden zodiac circle -->
  <g id="prague-ecliptic" stroke="url(#brassGold)">
    <circle cx="232" cy="226" r="128" fill="none" stroke-width="1.8" stroke-opacity="0.75"/>
    <circle cx="232" cy="226" r="118" fill="none" stroke-width="0.8" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  </g>

  <!-- ================= 3. MECHANICAL GEARWORK (HOROLOGY SKELETON) ================= -->
  <g id="mechanical-gears">
    <!-- Secondary Meshed Escapement Gear (Offset Upper-Left) -->
    <g transform="translate(170, 180)" stroke="url(#brassGold)">
      <!-- 12 Gear Teeth -->
      <path d="M 0 -45 L 6 -45 L 8 -52 L -8 -52 L -6 -45 Z
               M 32 -32 L 36 -32 L 41 -37 L 30 -43 L 28 -37 Z
               M 45 0 L 45 6 L 52 8 L 52 -8 L 45 -6 Z
               M 32 32 L 32 36 L 37 41 L 43 30 L 37 28 Z
               M 0 45 L -6 45 L -8 52 L 8 52 L 6 45 Z
               M -32 32 L -36 32 L -41 37 L -30 43 L -28 37 Z
               M -45 0 L -45 -6 L -52 -8 L -52 8 L -45 6 Z
               M -32 -32 L -32 -36 L -37 -41 L -43 -30 L -37 -28 Z"
            fill="url(#gearSteel)" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke-width="0.8" stroke-dasharray="2 3"/>
      <!-- Inner Spokes -->
      <line x1="-30" y1="0" x2="30" y2="0" stroke-width="1.2"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="8" fill="url(#brassGold)" stroke="none"/>
    </g>

    <!-- Primary Center Driving Gear -->
    <g transform="translate(250, 250)" stroke="url(#brassGold)">
      <!-- 16 Teeth Spur Gear Outer Contour -->
      <circle cx="0" cy="0" r="68" fill="url(#gearSteel)" stroke-width="1.8"/>
      <!-- Decorative Cutout Windows in Gear Body -->
      <circle cx="0" cy="-42" r="10" fill="#0C1224" stroke-width="1"/>
      <circle cx="42" cy="0" r="10" fill="#0C1224" stroke-width="1"/>
      <circle cx="0" cy="42" r="10" fill="#0C1224" stroke-width="1"/>
      <circle cx="-42" cy="0" r="10" fill="#0C1224" stroke-width="1"/>
    </g>
  </g>

  <!-- ================= 4. THE GOLDEN RATIO FIBONACCI SPIRAL ================= -->
  <!-- Logarithmic Golden Spiral flowing outward from center pinion across quadrants -->
  <g id="fibonacci-spiral">
    <path d="M 250 250
             A 12 12 0 0 1 262 250
             A 20 20 0 0 1 262 270
             A 32 32 0 0 1 230 270
             A 52 52 0 0 1 230 218
             A 84 84 0 0 1 314 218
             A 136 136 0 0 1 314 354
             A 220 220 0 0 1 94 354"
          fill="none" stroke="url(#amberGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Delicate Golden Fibonacci Nodes along the Curve -->
    <circle cx="262" cy="250" r="2.5" fill="#FFF5D6"/>
    <circle cx="262" cy="270" r="2.5" fill="#FFF5D6"/>
    <circle cx="230" cy="270" r="3" fill="#FFEBB8"/>
    <circle cx="230" cy="218" r="3.5" fill="#FFE59E"/>
    <circle cx="314" cy="218" r="4" fill="url(#amberGlow)"/>
    <circle cx="314" cy="354" r="4.5" fill="url(#amberGlow)"/>
  </g>

  <!-- ================= 5. ASTRONOMICAL POINTER HANDS ================= -->
  <g id="astronomical-hands" stroke-linecap="round">
    <!-- Sun Hand (Kim Mặt Trời pointing toward hour X / ~300°) -->
    <g transform="rotate(-62, 250, 250)">
      <!-- Long Slender Golden Hand -->
      <line x1="250" y1="250" x2="250" y2="70" stroke="url(#brassGold)" stroke-width="2.2"/>
      <!-- Radiant Sun Medallion -->
      <g transform="translate(250, 95)">
        <circle cx="0" cy="0" r="9" fill="url(#amberGlow)" stroke="url(#brassGold)" stroke-width="1"/>
        <line x1="0" y1="-14" x2="0" y2="14" stroke="url(#amberGlow)" stroke-width="1.5"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="url(#amberGlow)" stroke-width="1.5"/>
        <line x1="-10" y1="-10" x2="10" y2="10" stroke="url(#amberGlow)" stroke-width="1.2"/>
        <line x1="-10" y1="10" x2="10" y2="-10" stroke="url(#amberGlow)" stroke-width="1.2"/>
      </g>
    </g>

    <!-- Moon Hand (Kim Mặt Trăng pointing toward hour IV / ~120°) -->
    <g transform="rotate(118, 250, 250)">
      <line x1="250" y1="250" x2="250" y2="92" stroke="url(#brassGold)" stroke-width="1.8"/>
      <!-- Moon Phase Sphere (Bán cầu trăng) -->
      <g transform="translate(250, 115)">
        <circle cx="0" cy="0" r="7.5" fill="#FFF5D6" stroke="url(#brassGold)" stroke-width="0.8"/>
        <path d="M 0 -7.5 A 7.5 7.5 0 0 1 0 7.5 A 3.5 7.5 0 0 1 0 -7.5 Z" fill="#121A33"/>
      </g>
    </g>

    <!-- Central Brass Pinion Cap -->
    <circle cx="250" cy="250" r="16" fill="url(#brassGold)" stroke="#664612" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="8" fill="#FF9A5C" stroke="none"/>
    <circle cx="250" cy="250" r="3" fill="#FFF5D6"/>
  </g>
</svg>

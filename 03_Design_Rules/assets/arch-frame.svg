<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%" aria-label="AureLysnOS Grimoire UI Card Frame">
  <defs>
    <!-- Celestial Gold Frame Gradient -->
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="35%" stop-color="#E5BF70"/>
      <stop offset="75%" stop-color="#BA903B"/>
      <stop offset="100%" stop-color="#7A5617"/>
    </linearGradient>

    <!-- Deep Lapis Card Background -->
    <linearGradient id="lapisBackdrop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E38"/>
      <stop offset="50%" stop-color="#0E162B"/>
      <stop offset="100%" stop-color="#080C17"/>
    </linearGradient>

    <linearGradient id="gemWine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F08AA6"/>
      <stop offset="50%" stop-color="#8E1B3A"/>
      <stop offset="100%" stop-color="#4D0E1F"/>
    </linearGradient>
  </defs>

  <!-- ================= 1. CARD BACKDROP (TRANSLUCENT LAPIS SLATE) ================= -->
  <rect x="14" y="14" width="372" height="572" rx="16" fill="url(#lapisBackdrop)" stroke="none"/>

  <!-- ================= 2. ARCHITECTURAL DOUBLE BORDERS ================= -->
  <g id="frame-borders" stroke="url(#frameGold)">
    <!-- Outer Primary Bevel Border -->
    <rect x="20" y="20" width="360" height="560" rx="12" fill="none" stroke-width="1.8" stroke-opacity="0.9"/>

    <!-- Inner Hairline Border -->
    <rect x="28" y="28" width="344" height="544" rx="8" fill="none" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- Corner Inset Notches -->
    <path d="M 20 52 L 52 52 L 52 20" fill="none" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="52" cy="52" r="2.5" fill="url(#frameGold)" stroke="none"/>

    <path d="M 380 52 L 348 52 L 348 20" fill="none" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="348" cy="52" r="2.5" fill="url(#frameGold)" stroke="none"/>

    <path d="M 20 548 L 52 548 L 52 580" fill="none" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="52" cy="548" r="2.5" fill="url(#frameGold)" stroke="none"/>

    <path d="M 380 548 L 348 548 L 348 580" fill="none" stroke-width="1.2" stroke-opacity="0.75"/>
    <circle cx="348" cy="548" r="2.5" fill="url(#frameGold)" stroke="none"/>
  </g>

  <!-- ================= 3. TOP CROWN: CELTIC TRIQUETRA (TRINITY KNOT) ================= -->
  <!-- Reference: ref_cover_grimoire.jpg top crest -->
  <g id="crown-triquetra" transform="translate(200, 48)" stroke="url(#frameGold)" fill="none" stroke-width="1.75">
    <!-- Center Inset Ring -->
    <circle cx="0" cy="0" r="10" stroke-opacity="0.6"/>
    <!-- Triquetra 3 Interlocking Arcs -->
    <path d="M 0 -16 C -12 -5, -12 12, 0 8 C 12 12, 12 -5, 0 -16 Z"/>
    <path d="M -14 8 C -3 14, 11 4, 7 -7 C 3 -18, -10 -10, -14 8 Z"/>
    <path d="M 14 8 C 3 14, -11 4, -7 -7 C -3 -18, 10 -10, 14 8 Z"/>
    <!-- Top Crown Polaris Star -->
    <path d="M 0 -22 L 2 -18 L 6 -17 L 2 -16 L 0 -12 L -2 -16 L -6 -17 L -2 -18 Z" fill="url(#frameGold)" stroke="none"/>
  </g>

  <!-- ================= 4. ALCHEMY CORNER NODES (4 SACRED ELEMENTS) ================= -->
  <g id="alchemy-elements" stroke="url(#frameGold)" stroke-width="1" fill="none" opacity="0.8">
    <!-- Top-Left Element (Air / Khí) -->
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="8"/>
      <polygon points="0,-5 4.3,3 -4.3,3"/>
      <line x1="-3" y1="-0.5" x2="3" y2="-0.5"/>
    </g>
    <!-- Top-Right Element (Fire / Hỏa) -->
    <g transform="translate(360, 40)">
      <circle cx="0" cy="0" r="8"/>
      <polygon points="0,-5 4.3,3 -4.3,3"/>
    </g>
    <!-- Bottom-Left Element (Water / Thủy) -->
    <g transform="translate(40, 560)">
      <circle cx="0" cy="0" r="8"/>
      <polygon points="0,5 4.3,-3 -4.3,-3"/>
    </g>
    <!-- Bottom-Right Element (Earth / Thổ) -->
    <g transform="translate(360, 560)">
      <circle cx="0" cy="0" r="8"/>
      <polygon points="0,5 4.3,-3 -4.3,-3"/>
      <line x1="-3" y1="0.5" x2="3" y2="0.5"/>
    </g>
  </g>

  <!-- ================= 5. SIDE MID-POINT FLOURISHES ================= -->
  <g id="side-anchors" stroke="url(#frameGold)" fill="none">
    <g transform="translate(20, 300)">
      <polygon points="0,-12 8,0 0,12 -8,0" fill="url(#frameGold)" stroke="none"/>
      <circle cx="12" cy="0" r="2" fill="url(#frameGold)" stroke="none"/>
    </g>
    <g transform="translate(380, 300)">
      <polygon points="0,-12 8,0 0,12 -8,0" fill="url(#frameGold)" stroke="none"/>
      <circle cx="-12" cy="0" r="2" fill="url(#frameGold)" stroke="none"/>
    </g>
  </g>

  <!-- ================= 6. BOTTOM CREST: TRIPLE MOON (TRĂNG BA NGÔI) ================= -->
  <!-- Reference: ref_cover_grimoire.jpg bottom crest -->
  <g id="bottom-triple-moon" transform="translate(200, 552)">
    <!-- Central Full Moon -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="url(#frameGold)" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="6" fill="url(#gemWine)"/>
    <circle cx="-1.5" cy="-1.5" r="1.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- Left Waxing Crescent Moon -->
    <path d="M -15 -8 C -11 -5, -11 5, -15 8 C -21 6, -23 -6, -15 -8 Z"
          fill="url(#frameGold)" stroke="none"/>

    <!-- Right Waning Crescent Moon -->
    <path d="M 15 -8 C 11 -5, 11 5, 15 8 C 21 6, 23 -6, 15 -8 Z"
          fill="url(#frameGold)" stroke="none"/>

    <!-- Flanking Filigree Horizontal Bars -->
    <line x1="-30" y1="0" x2="-80" y2="0" stroke="url(#frameGold)" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-80" cy="0" r="2" fill="url(#frameGold)" stroke="none"/>

    <line x1="30" y1="0" x2="80" y2="0" stroke="url(#frameGold)" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="80" cy="0" r="2" fill="url(#frameGold)" stroke="none"/>
  </g>
</svg>
